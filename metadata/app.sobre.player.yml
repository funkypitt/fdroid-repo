Summary: YouTube subscriptions as audio only, all text
Description: |
  Plays the sound of the channels you follow, and nothing else: no video, no
  thumbnails, no recommendations, no Shorts, no comments. A chronological list in
  plain text; chapters, speed, downloads, background play. No account, no tracking.
  Built on NewPipeExtractor; not affiliated with YouTube.
