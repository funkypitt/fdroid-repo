AntiFeatures:
  NonFreeDep:
    en-US: If chosen at first start, Google ML Kit's document scanner runs through Google Play services.
  UpstreamNonFree:
    en-US: The app includes Google ML Kit (closed code), next to the free engines (Tesseract and its own page finder).
  Tracking:
    en-US: Only with ML Kit chosen, Google's library sends usage statistics to Google (never the documents). The free engines send nothing.
