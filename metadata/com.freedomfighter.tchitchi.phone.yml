Name: Tchitchi Phone
Summary: A phone app in large type for older people, calm and without surprises
Description: |
  The phone of the Tchitchi launcher as an app of its own, for a phone that keeps its
  launcher. A call rings on the whole screen with the caller's photo and name in large type
  and two big buttons; missed calls stay at the top until answered with "call back" or "OK".
  Contacts read favourites, then the people called lately, then everyone, with a search
  field; a keypad with large keys; the list of calls. Twelve themes. No account, no network,
  nothing leaves the phone.
