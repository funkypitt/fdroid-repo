Summary: 'Text-only podcast player: subscribe, download, listen'
Description: |
  Feeds added by pasting or sharing a link; episodes in three plain lists — on the
  phone, new, by channel. Resumes where you stopped; a finished episode frees its
  file. No directory, no recommendations, no account: OPML and one settings file are
  the whole sync with the desktop twin.
